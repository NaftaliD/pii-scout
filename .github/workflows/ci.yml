name: CI

# Must run on every push to main: Render's autoDeployTrigger "checksPass" deploys only
# commits that have at least one passing check.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Redis, so the Lua scripts in redis-stores.ts are tested against the real engine.
    # (Locally the same tests run against an in-process mock.)
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm --prefix server run lint
      - run: npm --prefix web run lint
      - run: npm --prefix server run typecheck
      - run: npm --prefix web run typecheck
      - run: npm --prefix server test
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix server run build

  # Proves the production image builds and answers /health, the same thing Render will do.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scanner .
      - name: Smoke test the container
        run: |
          docker run -d --name scanner -p 3000:3000 -e PORT=3000 scanner
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs scanner
          exit 1
