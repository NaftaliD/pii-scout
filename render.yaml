services:
  # Shared state for rate limits, stream slots and the spend budget. In-memory only (no persistence)
  # on the free plan, which is fine for counters.
  - type: keyvalue
    name: scanner-redis
    plan: free
    # noeviction: when full, refuse writes instead of silently deleting keys (the spend counter must not vanish).
    maxmemoryPolicy: noeviction
    # Empty list = reachable only from other Render services in the same region, not from the internet.
    ipAllowList: []

  - type: web
    name: scanner
    runtime: docker
    plan: free
    branch: main
    # Deploy a commit only after its GitHub Actions checks (ci.yml) have all passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      # Default to the free dummy classifier so a public URL can never spend real money.
      - key: LLM_MODE
        value: fake
      - key: LLM_BUDGET_UNITS
        value: "20"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scanner-redis
          property: connectionString
      # Only needed if LLM_MODE is switched to "anthropic" in the dashboard.
      - key: LLM_API_KEY
        sync: false
